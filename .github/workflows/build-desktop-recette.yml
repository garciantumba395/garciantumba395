# Construit « Solisend Recette » : application Windows AUTONOME (PHP + SQLite embarqués, données fictives, SMS simulés).
# Aucun déploiement, aucune clé, aucun service payant. Résultat : artefact téléchargeable (installateur + version portable).
name: Build Solisend Recette (Windows)
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['packaging/desktop-local/**', '.github/workflows/build-desktop-recette.yml']

permissions:
  contents: write   # uniquement pour publier la release « recette-windows » de ce dépôt

jobs:
  windows-recette:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, fileinfo, openssl, curl, zip, gd, bcmath
          tools: composer:v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dépendances PHP (sans paquets de développement) et assets
        run: |
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          npm install --no-audit --no-fund
          npm run build
      - name: Préparer l'application et le PHP embarqué
        run: |
          D=packaging/desktop-local/stage
          mkdir -p "$D/app" "$D/php"
          for x in app bootstrap config database lang public resources routes vendor artisan composer.json; do [ -e "$x" ] && cp -r "$x" "$D/app/"; done
          rm -f "$D/app/bootstrap/cache/"*.php "$D/app"/database/*.sqlite
          PHPDIR="$(dirname "$(which php)")"
          cp -r "$PHPDIR"/* "$D/php/"
          ls "$D/php" | head -30
      - name: Test de fumée (copie de l'application, migrations, données fictives, serveur, page de connexion)
        run: |
          D="$PWD/packaging/desktop-local/stage"; T="$RUNNER_TEMP/smoke"; rm -rf "$T"; mkdir -p "$T"
          cp -r "$D/app" "$T/app"; mkdir -p "$T/app/storage/"{app,logs,framework/{cache/data,sessions,views}} "$T/app/bootstrap/cache"; : > "$T/database.sqlite"
          export APP_ENV=local APP_DEBUG=false APP_KEY="base64:$(head -c32 /dev/urandom | base64)" APP_URL=http://127.0.0.1:8777 DB_CONNECTION=sqlite DB_DATABASE="$T/database.sqlite" SESSION_DRIVER=file CACHE_STORE=file QUEUE_CONNECTION=sync MAIL_MAILER=log LOG_CHANNEL=single SMS_PROVIDER=fake SMS_SENDING_ENABLED=false SECURITY_REQUIRE_EMAIL_VERIFICATION=false SECURITY_REQUIRE_2FA_FOR_ADMINS=false PHPRC="$D/php" PHP_INI_SCAN_DIR=
          PHP="$D/php/php.exe -d extension_dir=$D/php/ext"
          cd "$T/app"
          $PHP artisan migrate --force | tail -3
          $PHP artisan db:seed --class=DemoSeeder --force | grep -c "Données de démonstration prêtes"
          cd public
          $PHP -S 127.0.0.1:8777 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > "$T/server.log" 2>&1 &
          sleep 5
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8777/connexion)"; echo "connexion HTTP $code"
          [ "$code" = "200" ] || { tail -30 "$T/server.log"; tail -30 "$T"/app/storage/logs/*.log 2>/dev/null; exit 1; }
      - name: Construire l'installateur Windows
        working-directory: packaging/desktop-local
        run: |
          npm install --no-audit --no-fund
          npm run dist
          ls -la dist
          (cd dist && sha256sum *.exe > SHA256.txt && cat SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: solisend-recette-windows
          path: |
            packaging/desktop-local/dist/*.exe
            packaging/desktop-local/dist/SHA256.txt
      - name: Publier / mettre à jour la release « recette-windows » (téléchargement depuis le dépôt)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packaging/desktop-local/dist
          gh release delete recette-windows --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create recette-windows --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Solisend Recette (Windows)" \
            --notes "Version de RECETTE autonome : PHP et base SQLite embarqués, données fictives, SMS simulés (aucun envoi réel). Deux fichiers : « Installateur » (installe l'application) ou « Portable » (s'exécute sans installation). Commit ${GITHUB_SHA}. Non signée : Windows SmartScreen peut afficher un avertissement (Informations complémentaires > Exécuter quand même). Mot de passe des comptes de démonstration : fichier COMPTES-DEMO.txt, indiqué au premier lancement." \
            *.exe SHA256.txt
