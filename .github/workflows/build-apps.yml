# Construit les applications installables (APK Android, installateur Windows). Déclenchement MANUEL uniquement :
# aucun déploiement, aucun service payant. Fournir l'URL publique HTTPS de l'application hébergée.
name: Build installable apps
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL publique HTTPS de l'application (ex. https://sms.votre-domaine.cd)"
        required: true

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Valider l'URL
        env: { APP_URL: "${{ inputs.app_url }}" }
        run: |
          case "$APP_URL" in https://*) ;; *) echo "L'URL doit commencer par https://"; exit 1;; esac
      - name: Configurer et générer le projet Android
        working-directory: packaging/android
        env: { APP_URL: "${{ inputs.app_url }}" }
        run: |
          node -e "const fs=require('fs');const u=new URL(process.env.APP_URL);const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.server.url=u.origin;c.server.allowNavigation=[u.hostname];fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: "Générer l'APK (signature de débogage, installable hors Play Store)"
        working-directory: packaging/android/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: sms-marketing-android-apk
          path: packaging/android/android/app/build/outputs/apk/debug/*.apk

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Valider l'URL
        shell: bash
        env: { APP_URL: "${{ inputs.app_url }}" }
        run: |
          case "$APP_URL" in https://*) ;; *) echo "L'URL doit commencer par https://"; exit 1;; esac
      - name: Configurer et construire
        working-directory: packaging/windows
        shell: bash
        env: { APP_URL: "${{ inputs.app_url }}" }
        run: |
          node -e "require('fs').writeFileSync('app-config.json', JSON.stringify({appUrl: new URL(process.env.APP_URL).origin}))"
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: sms-marketing-windows-exe
          path: packaging/windows/dist/*.exe
