# Taxi Kin — étape UNIQUE : produit le fichier d'activation (.alf) à envoyer à Unity pour obtenir la licence gratuite (Personal).
# (L'action game-ci/unity-request-activation-file est retirée : on appelle directement l'image Docker GameCI.)
name: Taxi Kin - fichier d'activation Unity
on:
  workflow_dispatch:
  push:
    paths: ['UnityProject/CI_ACTIVATION_TRIGGER']
jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Générer le fichier .alf
        run: |
          mkdir -p out && cd out
          docker run --rm -v "$PWD:/out" -w /out unityci/editor:ubuntu-2022.3.50f1-base-3 \
            bash -c 'unity-editor -batchmode -nographics -quit -logFile /dev/stdout -createManualActivationFile || true; cp -v *.alf /out/ 2>/dev/null || true; ls -la /out'
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: Manual-Activation-File
          path: out/*.alf
          if-no-files-found: error
